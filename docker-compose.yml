name: codex2api-sqlite

services:
  codex2api:
    image: ghcr.io/james-6-23/codex2api:latest
    container_name: codex2api-sqlite
    ports:
      - "${BIND_HOST:-0.0.0.0}:${CODEX_PORT:-8080}:${CODEX_PORT:-8080}"
    env_file:
      - .env
    environment:
      DATABASE_DRIVER: sqlite
      DATABASE_PATH: /data/codex2api.db
      CACHE_DRIVER: memory
    volumes:
      - sqlite-data:/data
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  sqlite-data:
    name: codex2api-sqlite_sqlite-data
